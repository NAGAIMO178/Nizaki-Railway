<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>神埼鉄道 運行情報・特急予約</title>

    <!-- PWA & Web Push Meta Tags -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#521EB7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="神埼鉄道" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon.png" />

    <!-- iOSホーム画面から起動した直後に表示する起動画像(機種ごとの解像度) -->
    <link rel="apple-touch-startup-image" href="./startup/iphone-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./startup/iphone-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./startup/iphone-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./startup/iphone-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./startup/iphone-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./startup/iphone-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./startup/iphone-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./startup/iphone-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./startup/iphone-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./startup/iphone-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./startup/iphone-640x1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <!-- Preload critical splash images -->
    <link rel="preload" href="./splash-sp.png" as="image" />
    <link rel="preload" href="./splash-pc.png" as="image" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #521EB7; /* 白画面を一瞬も出さず神埼パープルで即時表示 */
      }
      #root {
        min-height: 100%;
      }
      .splash-screen {
        position: fixed;
        inset: 0;
        background-color: #521EB7;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .splash-sp {
        display: flex;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
      }
      .splash-pc {
        display: none;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
      }
      @media (min-width: 640px) and (min-aspect-ratio: 1/1) {
        .splash-sp { display: none !important; }
        .splash-pc { display: flex !important; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" class="splash-screen">
        <div class="splash-sp">
          <img src="./splash-sp.png" alt="神埼鉄道" style="width: 100%; height: 100%; object-fit: cover;" fetchpriority="high" />
        </div>
        <div class="splash-pc">
          <img src="./splash-pc.png" alt="神埼鉄道" style="width: 100%; height: 100%; object-fit: cover;" fetchpriority="high" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
