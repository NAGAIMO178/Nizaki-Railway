name: Check

# プルリクエストで、型チェックとビルドを走らせる(マージする前に、失敗に気づくため)
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build project
        run: npm run build
